[project]
name = "nasahackaton"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "RandomGuy16", email = "aroon.delgado.25@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "cdsapi>=0.7.7",
    "copernicusmarine>=2.5.0",
    "earthaccess>=0.19.0",
    "h5netcdf>=1.8.1",
    "matplotlib>=3.11.2",
    "netcdf4>=1.7.4",
    "pandas>=3.0.6",
    "pydap>=3.5.11",
    "pyproj>=3.8.0",
    "pyshp>=3.1.6",
    "rasterio>=1.5.2",
    "requests>=2.34.2",
    "scipy>=1.18.1",
    "shapely>=2.2.0",
    "statsmodels>=0.15.0",
    "xarray>=2026.9.0",
]

[project.scripts]
nasahackaton = "nasahackaton:main"

[build-system]
requires = ["uv_build>=0.12.23,<0.13.0"]
build-backend = "uv_build"
